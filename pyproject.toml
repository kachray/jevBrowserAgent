[project]
name = "typed-browse"
version = "0.1.0"
description = "Portfolio browser agent: indexed page controls, typed decisions, independent verification."
requires-python = ">=3.12"
dependencies = [
    "playwright",
    "fastapi",
    "pydantic",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typed_browse"]
