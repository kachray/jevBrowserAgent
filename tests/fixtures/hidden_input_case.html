<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hidden input case</title>
</head>
<body>
<h1>Hidden input case</h1>
<label for="name">Name</label>
<input id="name" type="text" value="Ana">
<label for="pw">Password</label>
<input id="pw" type="password" value="sentinel-password">
<input type="hidden" value="sentinel-token">
<input type="file">
<button style="display:none">Secret</button>
<a href="#x" style="visibility:hidden">Invisible link</a>
<div style="height:3000px"></div>
<button type="button">Continue</button>
</body>
</html>
